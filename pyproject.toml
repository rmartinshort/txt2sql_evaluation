[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txt2sql-eval-harness"
version = "0.1.0"
description = "Text2SQL Decision-Model Judge combining programmatic SQL/result verification with TypeSafe Jev and Gemini escalation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlglot>=25.0",
    "tiktoken>=0.7",
    "httpx>=0.27",
    "google-genai>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
txt2sql-judge = "txt2sql_eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
